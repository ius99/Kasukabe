<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Kasukabe House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root {
  /* Layout: full-bleed 3D stage of a lane at dusk; HUD pinned to the corners; scrolls unroll as a centred washi sheet */
  --sky: #34407e;
  --ink: #3a2a1e;
  --cream: #fffaf0;
  --washi: #f6ecd4;
  --sumi: #2a201a;
  --sumi-soft: #5b4a3e;
  --shu: #e2462c;
  --glass: rgba(255, 250, 240, .94);
  --line: rgba(58, 42, 30, .92);
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
#stage {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #2c3a7a 0%, #5f5aa6 28%, #b77fb6 55%, #ee9fa8 76%, #f8c896 100%);
}
#stage canvas { display: block; touch-action: none; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--shu); outline-offset: 3px; }

/* Sticker-style chips: cream fill, ink outline, hard shadow (game UI feel) */
.chip {
  background: var(--glass); color: var(--ink);
  border: 2.5px solid var(--line); border-radius: 999px;
  box-shadow: 0 3px 0 var(--line);
  font-weight: 700;
}

.hud-top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; z-index: 5;
}
.brand { padding: 6px 14px; display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 18px; }
.brand span { font-size: 11px; letter-spacing: .1em; color: var(--sumi-soft); }
.hud-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hud-actions .chip { pointer-events: auto; padding: 6px 13px; font-size: 13px; }

.keys {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: var(--cream);
  text-shadow: 0 1px 0 var(--ink), 0 0 6px rgba(0,0,0,.45); z-index: 4; pointer-events: none;
}
.keys kbd {
  font-family: var(--body); background: var(--cream); color: var(--ink); border: 2px solid var(--ink);
  border-radius: 6px; padding: 1px 6px; text-shadow: none; box-shadow: 0 2px 0 var(--ink);
}

/* Action prompt doubles as the touch action button */
#prompt {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding: 9px 18px 9px 10px; display: flex; align-items: center; gap: 10px; font-size: 16px; z-index: 6;
  animation: bob 1.6s ease-in-out infinite;
}
#prompt kbd {
  font-family: var(--body); background: var(--shu); color: #fff; border-radius: 999px;
  min-width: 28px; height: 28px; display: grid; place-items: center; font-size: 13px; padding: 0 8px;
}
@keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
@media (pointer: coarse) { #prompt { left: auto; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); transform: none; animation: none; } }

.toast {
  position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--cream);
  text-shadow: 0 2px 0 var(--ink), 0 0 10px rgba(0,0,0,.4); white-space: nowrap; pointer-events: none; z-index: 4;
  transition: opacity .5s;
}

/* Neighbour speech bubbles */
#bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.bubble {
  position: absolute; left: 0; top: 0; padding: 6px 13px 7px; border-radius: 14px;
  background: #fffaf0; color: var(--ink); border: 2.5px solid var(--line); box-shadow: 0 3px 0 var(--line);
  font-size: 14px; font-weight: 700; white-space: nowrap; text-align: center;
  opacity: 0; transform: translate(-50%, -100%) scale(.6); transform-origin: 50% 100%;
  transition: opacity .25s, transform .25s cubic-bezier(.3,1.6,.5,1);
}
.bubble small { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--shu); }
.bubble::after {
  content: ""; position: absolute; left: calc(50% - 7px); bottom: -8px; width: 12px; height: 12px;
  background: #fffaf0; border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line); transform: rotate(45deg);
}
.bubble.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }

/* Touch stick */
#stick {
  position: fixed; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 116px; height: 116px; border-radius: 50%; z-index: 6; touch-action: none;
  background: rgba(255,250,240,.3); border: 2.5px solid rgba(255,250,240,.7);
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: var(--cream); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); pointer-events: none;
}

/* 3D-anchored scroll tags (wide screens) */
#tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.tag {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; font-size: 13px;
  border-radius: 8px; transform: translate(-50%, 0); transition: transform .2s, opacity .3s; white-space: nowrap;
}
.tag i { font-style: normal; font-family: var(--display); color: #fff; background: var(--shu); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; font-size: 13px; }
.tag.hot { transform: translate(-50%, -4px); }

.shelf {
  position: fixed; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px));
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; z-index: 4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shelf .chip { display: flex; align-items: center; gap: 7px; padding: 6px 13px; font-size: 14px; }
.shelf .chip i { font-style: normal; font-family: var(--display); color: var(--shu); }
@media (min-width: 720px) { .shelf { display: none; } }
@media (max-width: 719px) { #tags { display: none; } }

/* Intro */
#intro {
  position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .5s;
}
.intro-card {
  display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; max-width: 520px;
  background: var(--glass); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 6px 0 var(--line);
  padding: 22px 26px;
}
.vert { writing-mode: vertical-rl; font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--shu); letter-spacing: .06em; }
.intro-card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(34px, 8vw, 54px); line-height: 1; text-wrap: balance; }
.intro-card p { margin: 10px 0 18px; max-width: 36ch; line-height: 1.6; }
.intro-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.cta {
  background: var(--shu); color: #fff; border: 2.5px solid var(--line); border-radius: 999px; box-shadow: 0 4px 0 var(--line);
  padding: 10px 22px; font-weight: 900; letter-spacing: .03em;
}
.cta:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.ghost { background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; font-size: 14px; font-weight: 700; }
@media (max-width: 420px) { .intro-card { grid-template-columns: 1fr; } .vert { display: none; } }

/* Unrolled scroll */
#panel {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
  background: rgba(20, 16, 40, .45);
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: text; user-select: text;
}
.sheet { width: min(560px, 100%); display: flex; flex-direction: column; filter: drop-shadow(0 14px 30px rgba(0,0,0,.35)); }
.rod { height: 16px; border-radius: 8px; margin: 0 -12px; position: relative; z-index: 1; background: linear-gradient(180deg, #8a5a3c 0%, #4a2c1c 60%, #2e1a10 100%); border: 2px solid var(--ink); }
.rod::before, .rod::after { content: ""; position: absolute; top: -5px; width: 14px; height: 22px; border-radius: 5px; background: linear-gradient(180deg, #f1c75e, #a87a22); border: 2px solid var(--ink); }
.rod::before { left: -10px; } .rod::after { right: -10px; }
.paper {
  background: var(--washi); color: var(--sumi); overflow: auto; max-height: min(68vh, 620px);
  border-left: 2.5px solid var(--ink); border-right: 2.5px solid var(--ink);
  animation: unroll .7s cubic-bezier(.2,.8,.2,1);
  background-image: radial-gradient(rgba(120, 90, 50, .07) 1px, transparent 1.2px); background-size: 7px 7px;
}
@keyframes unroll { from { max-height: 0; } to { max-height: min(68vh, 620px); } }
.paper-inner { display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: 24px 26px 28px; }
.paper-inner > div { min-width: 0; }
.paper header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.paper h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; }
.paper .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--sumi-soft); margin-bottom: 4px; font-weight: 700; }
.paper .note { font-size: 12px; color: var(--sumi-soft); border-left: 3px solid var(--shu); padding-left: 8px; margin: 0 0 14px; }
.paper p { line-height: 1.7; margin: 0 0 12px; max-width: 60ch; }
.roll-up { background: var(--cream); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--sumi); white-space: nowrap; box-shadow: 0 2px 0 var(--ink); }
.side-kanji { writing-mode: vertical-rl; font-family: var(--display); font-weight: 800; font-size: 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hanko { writing-mode: horizontal-tb; width: 38px; height: 38px; border: 2.5px solid var(--shu); color: var(--shu); border-radius: 5px; display: grid; place-items: center; font-size: 20px; transform: rotate(-6deg); }
.proj { padding: 12px 0; border-top: 2px dashed rgba(42,32,26,.2); }
.proj h3 { margin: 0 0 4px; font-family: var(--display); font-size: 18px; }
.proj p { margin: 0 0 6px; font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font-size: 11px; font-weight: 700; padding: 2px 9px; border: 1.5px solid var(--ink); border-radius: 999px; background: #fff7e2; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.skills h3 { margin: 0 0 6px; font-family: var(--display); font-size: 16px; }
.skills ul { margin: 0; padding-left: 18px; line-height: 1.7; font-size: 14px; }
.contact-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 2px dashed rgba(42,32,26,.2); }
.contact-row small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sumi-soft); font-weight: 700; }
.contact-row code { font-family: var(--body); font-weight: 700; user-select: all; overflow-wrap: anywhere; }
@media (max-width: 480px) { .paper-inner { grid-template-columns: 1fr; padding: 20px 18px 22px; } .side-kanji { display: none; } }

#nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--cream); }
@media (prefers-reduced-motion: reduce) { .paper, #prompt { animation: none; } .bubble { transition: opacity .2s; } }
</style>

<div id="stage" aria-hidden="true"></div>

<div class="hud-top">
  <div class="brand chip"><b>Kasukabe</b><span>preview</span></div>
  <div class="hud-actions">
    <button class="chip" id="soundBtn" type="button" aria-pressed="true">Sound: on</button>
    <button class="chip" id="deskBtn" type="button" hidden>Jump to the desk</button>
  </div>
</div>

<div class="keys" id="keys" hidden><kbd>W A S D</kbd> walk <kbd>Shift</kbd> run <kbd>E</kbd> interact <kbd>M</kbd> sound</div>
<div class="toast" id="toast"></div>
<div id="bubbles" aria-live="polite"></div>
<button class="chip" id="prompt" type="button" hidden><kbd>E</kbd><span id="promptText"></span></button>
<div id="stick" hidden><div id="knob"></div></div>

<div id="tags"></div>
<nav class="shelf" id="shelf" aria-label="Scrolls" hidden></nav>

<section id="intro">
  <div class="intro-card">
    <div class="vert" aria-hidden="true">春日部</div>
    <div>
      <h1>Kasukabe</h1>
      <p>Walk home down the lane at dusk, say hi to the neighbours, slide the shoji open and sit at the desk. Each scroll on the desk opens a part of the portfolio.</p>
      <div class="intro-actions">
        <button class="cta" id="enterBtn" type="button">Start walking</button>
        <button class="ghost" id="introSkip" type="button">Go straight to the desk</button>
      </div>
    </div>
  </div>
</section>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="sheet">
    <div class="rod"></div>
    <div class="paper" id="paper"></div>
    <div class="rod"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;
  const $ = (id) => document.getElementById(id);

  // ---------- Sound: everything is synthesised with Web Audio, so there are no files to load ----------
  const Sound = (() => {
    let ctx = null, master = null, noiseBuf = null, started = false, muted = false;
    const bus = {}, listener = { x: 0, z: 40 };
    try { muted = localStorage.getItem('kasukabe-muted') === '1'; } catch (e) {}
    const live = () => !!ctx && ctx.state === 'running' && !muted;

    function init() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { ctx = new AC(); } catch (e) { return; }
        master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ctx.destination);
        bus.sfx = ctx.createGain(); bus.sfx.gain.value = 0.85; bus.sfx.connect(master);
        bus.amb = ctx.createGain(); bus.amb.gain.value = 0.6; bus.amb.connect(master);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        document.addEventListener('visibilitychange', () => { if (document.hidden) ctx.suspend(); else ctx.resume(); });
      }
      if (ctx.state === 'suspended') ctx.resume();
      if (!started) { started = true; startAmbience(); }
    }
    function env(g, t, peak, a, dcy) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy);
    }
    function out(dest, pan) {
      if (pan === undefined || !ctx.createStereoPanner) return dest;
      const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(dest); return p;
    }
    function noise({ t = 0, dur = 0.1, type = 'bandpass', f = 1000, f2, q = 1, gain = 0.2, a = 0.005, dest = bus.sfx, pan } = {}) {
      const at = ctx.currentTime + t;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q;
      fl.frequency.setValueAtTime(f, at); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, at + a + dur);
      const g = ctx.createGain(); env(g, at, gain, a, dur);
      src.connect(fl); fl.connect(g); g.connect(out(dest, pan));
      src.start(at, Math.random() * 1.5); src.stop(at + a + dur + 0.05);
    }
    function tone({ t = 0, dur = 0.2, type = 'sine', f = 440, f2, gain = 0.2, a = 0.005, dest = bus.sfx, pan, lp } = {}) {
      const at = ctx.currentTime + t;
      const o = ctx.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f, at); if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + a + dur);
      const g = ctx.createGain(); env(g, at, gain, a, dur);
      let node = o;
      if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
      node.connect(g); g.connect(out(dest, pan));
      o.start(at); o.stop(at + a + dur + 0.05);
    }
    const bell = (t, f, v, pan) => [[1, 0.06], [2.76, 0.022], [5.4, 0.009]].forEach(([m, gn]) =>
      tone({ t, dur: 2.4 / Math.pow(m, 0.4), f: f * m, gain: gn * v, a: 0.003, dest: bus.amb, pan }));

    // evening ambience: a breeze, higurashi cicadas, a wind chime under the eaves, distant crows
    function startAmbience() {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 420;
      const g = ctx.createGain(); g.gain.value = 0.05;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
      const lg = ctx.createGain(); lg.gain.value = 0.035;
      lfo.connect(lg); lg.connect(g.gain);
      src.connect(fl); fl.connect(g); g.connect(bus.amb);
      src.start(); lfo.start();
      every(higurashi, 2.5, 7, 14);
      every(furin, 1.5, 3.5, 8);
      every(crows, 10, 20, 38);
    }
    function every(fn, first, min, max) {
      const run = (delay) => setTimeout(() => { if (live() && !document.hidden) fn(); run(min + Math.random() * (max - min)); }, delay * 1000);
      run(first);
    }
    function higurashi() {
      const pan = Math.random() * 1.6 - 0.8, n = 14 + Math.floor(Math.random() * 8), base = 4000 + Math.random() * 500;
      for (let i = 0; i < n; i++) {
        const k = i / n, f = base * (1 - k * 0.06);
        tone({ t: i * 0.115, dur: 0.075, f, f2: f * 0.93, gain: 0.028 * (1 - k * 0.7) * (i < 2 ? 0.5 : 1), a: 0.012, dest: bus.amb, pan });
      }
    }
    function furin() {
      const v = Math.max(0.08, 1 - Math.hypot(listener.x, listener.z - 4.4) / 18);
      const notes = [1568, 1760, 2093, 2349, 2637];
      bell(0, notes[Math.floor(Math.random() * 5)], v, 0.15);
      if (Math.random() < 0.45) bell(0.16 + Math.random() * 0.2, notes[Math.floor(Math.random() * 5)], v * 0.7, 0.2);
    }
    function crows() {
      const pan = Math.random() * 1.4 - 0.7, n = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        tone({ t: i * 0.38, dur: 0.22, type: 'sawtooth', f: 690, f2: 520, gain: 0.03, a: 0.02, lp: 1300, dest: bus.amb, pan });
        noise({ t: i * 0.38, dur: 0.2, f: 1100, q: 3, gain: 0.012, a: 0.02, dest: bus.amb, pan });
      }
    }

    const api = {
      init,
      get muted() { return muted; },
      setMuted(m) {
        muted = m;
        try { localStorage.setItem('kasukabe-muted', m ? '1' : '0'); } catch (e) {}
        if (!m) init();
        if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.05);
      },
      listen(x, z) { listener.x = x; listener.z = z; },
      step(surface) {
        if (!live()) return;
        const v = 0.85 + Math.random() * 0.3;
        if (surface === 'tatami') noise({ dur: 0.06, type: 'lowpass', f: 600 * v, gain: 0.13 });
        else if (surface === 'wood') { noise({ dur: 0.05, f: 1100 * v, q: 2, gain: 0.12 }); tone({ dur: 0.07, type: 'triangle', f: 210 * v, f2: 160, gain: 0.12 }); }
        else { noise({ dur: 0.045, f: 2200 * v, q: 1.4, gain: 0.15 }); tone({ dur: 0.06, f: 120 * v, f2: 80, gain: 0.13 }); }
      },
      block(t = 0, g = 1) { if (!live()) return; tone({ t, dur: 0.08, f: 820, f2: 700, gain: 0.22 * g }); tone({ t, dur: 0.05, f: 1640, gain: 0.07 * g }); },
      door(open) {
        if (!live()) return;

    }
    const near = THREE.MathUtils.clamp(1 - (c.z - 3.5) / 3, 0, 1) * (Math.abs(c.x) < 5 ? 1 : 0);  // pull up and back near the porch
    return { pos: new THREE.Vector3(c.x * 0.6, c.y + 3.0 + near * 0.8, Math.min(c.z + 5.2 + near * 0.8, 52.4)), look: new THREE.Vector3(c.x * 0.8, c.y + 1.0, c.z - 1.2) };
  }
  function snapCamera() { const g = cameraGoal(); camera.position.copy(g.pos); camLook.copy(g.look); }
  function fovFor() {
    const aspect = aspectNow(), desk = state === 'desk' || state === 'sitting';
    const hfov = (desk ? 64 : 74) * Math.PI / 180;
    return THREE.MathUtils.clamp(2 * Math.atan(Math.tan(hfov / 2) / aspect) * 180 / Math.PI, desk ? 42 : 50, 80);
  }

  // ---------- Loop ----------
  let nextBlink = 2, blinkT = -1, lastStep = 0, catNext = 0;
  const clock = new THREE.Clock();

  function update(dt) {
    time += dt;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; tw.t += dt;
      const k = Math.min(1, tw.t / tw.dur);
      tw.fn(k * k * (3 - 2 * k));
      if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
    }

    // player movement; the camera looks toward -z, so "up" walks toward home
    const p = chibi.root.position;
    let ix = 0, iz = 0;
    if (state === 'play' && ui.panel.hidden) {
      ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stickVec.x;
      iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + stickVec.y;
    }
    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }
    const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(stickVec.x, stickVec.y) > 0.95;
    const speed = inside(p) ? 2.2 : (run ? 5.2 : 3.2);
    vel.x += (ix * speed - vel.x) * (1 - Math.exp(-dt * 12));
    vel.z += (iz * speed - vel.z) * (1 - Math.exp(-dt * 12));
    const moveSpeed = Math.hypot(vel.x, vel.z);
    if (state === 'play') {
      p.x += vel.x * dt; p.z += vel.z * dt;
      collide(p);
      p.y += (groundY(p.x, p.z) - p.y) * (1 - Math.exp(-dt * 18));
      if (moveSpeed > 0.15) chibi.root.rotation.y = lerpAngle(chibi.root.rotation.y, Math.atan2(vel.x, vel.z), 1 - Math.exp(-dt * 14));
    } else vel.set(0, 0, 0);

    // pose
    const swing = Math.min(1, moveSpeed / 3);
    if (swing > 0.05) walkPhase += dt * (6 + moveSpeed * 1.6);
    const stepIdx = Math.floor(walkPhase / Math.PI);
    if (stepIdx !== lastStep) { lastStep = stepIdx; if (state === 'play' && swing > 0.3) Sound.step(inside(p) ? 'tatami' : p.y > 0.15 ? 'wood' : 'stone'); }
    Sound.listen(p.x, p.z);
    const s = Math.sin(walkPhase) * swing;
    readK += ((openId ? 1 : 0) - readK) * (1 - Math.exp(-dt * 6));
    chibi.legL.rotation.x = s * 0.8 + sitK * Math.PI / 2;
    chibi.legR.rotation.x = -s * 0.8 + sitK * Math.PI / 2;
    chibi.armL.rotation.x = -s * 0.6 - readK * 1.15 - sitK * 0.25;
    chibi.armR.rotation.x = s * 0.6 - readK * 1.15 - sitK * 0.25;
    chibi.body.position.y = Math.abs(Math.sin(walkPhase)) * 0.06 * swing - sitK * 0.1;
    chibi.body.rotation.z = s * 0.05;
    chibi.body.rotation.x = swing * 0.08;
    chibi.head.rotation.z = state === 'desk' || (state === 'play' && swing < 0.05) ? Math.sin(time * 1.3) * 0.05 : 0;
    chibi.head.rotation.x = readK * 0.18 + (state === 'desk' && !openId ? 0.08 : 0);

    nextBlink -= dt;
    if (nextBlink <= 0) { blinkT = 0; nextBlink = 2 + Math.random() * 3; }
    if (blinkT >= 0) {
      blinkT += dt;
      const k = blinkT < 0.07 ? 1 - blinkT / 0.07 : Math.min(1, (blinkT - 0.07) / 0.07);
      chibi.eyes.concat(...npcs.map((n) => n.c.eyes)).forEach((e) => (e.scale.y = 1.35 * Math.max(0.1, k)));
      if (blinkT > 0.14) blinkT = -1;
    }

    // neighbours: turn, hop and wave while you are close
    npcs.forEach((n) => {
      const r = n.c.root.position, dx = p.x - r.x, dz = p.z - r.z, d = Math.hypot(dx, dz);
      if (state === 'play' && d < 3.6 && !n.greeting) { n.greeting = true; n.hopT = 0; Sound.voice(n.voice, n.line); }
      if (n.greeting && (d > 4.4 || state !== 'play')) n.greeting = false;
      n.k += ((n.greeting ? 1 : 0) - n.k) * (1 - Math.exp(-dt * 7));
      r.y = 0;
      n.c.root.rotation.y = lerpAngle(n.c.root.rotation.y, n.greeting ? Math.atan2(dx, dz) : n.idleYaw, 1 - Math.exp(-dt * 6));
      n.c.armR.rotation.z = 0.12 + n.k * (2.35 + Math.sin(time * 11 + n.ph) * 0.4);
      n.hopT = Math.min(1, n.hopT + dt / 0.35);
      n.c.body.position.y = Math.sin(Math.PI * n.hopT) * 0.14;
      n.c.body.rotation.z = Math.sin(time * 1.4 + n.ph) * 0.03;
      n.c.head.rotation.z = n.k * 0.12 * Math.sin(time * 3 + n.ph);
      n.el.classList.toggle('on', n.k > 0.5);
      if (n.k > 0.02) {
        tmp.copy(r); tmp.y += 1.85; tmp.project(camera);
        n.el.style.left = ((tmp.x * 0.5 + 0.5) * innerWidth) + 'px';
        n.el.style.top = ((-tmp.y * 0.5 + 0.5) * innerHeight) + 'px';
        n.el.style.visibility = tmp.z < 1 ? 'visible' : 'hidden';
      }
    });

    scrollGroups.forEach((g) => {
      const id = g.userData.scroll.id;
      const goal = openId === id ? 0.42 : (hovered === id && state === 'desk' && !openId ? 0.07 : 0);
      g.userData.lift += (goal - g.userData.lift) * (1 - Math.exp(-dt * 8));
      g.position.y = g.userData.baseY + g.userData.lift;
      g.userData.paperMat.emissiveIntensity = Math.min(0.6, g.userData.lift * 4) + (state === 'desk' && !reduceMotion ? 0.1 + 0.08 * Math.sin(time * 2.4 + g.position.x * 6) : 0);
    });

    // ambient life
    catBody.scale.y = 0.7 + Math.sin(time * 2) * 0.03;
    if (state === 'play' && time > catNext && Math.hypot(p.x - LANE_X, p.z - 30.8) < 1.8) { Sound.meow(); catNext = time + 12; }
    clouds.forEach((c, i) => { c.position.x += dt * (0.4 + i * 0.05); if (c.position.x > 110) c.position.x = -110; });
    if (PETALS) {
      const a = petalGeo.attributes.position.array;
      for (let i = 0; i < PETALS; i++) {
        a[i * 3 + 1] -= dt * (0.3 + (pSeed[i] % 1) * 0.3);
        a[i * 3] += dt * (0.2 + Math.sin(time * 1.3 + pSeed[i]) * 0.3);
        if (a[i * 3 + 1] < 0 || a[i * 3] > 9) resetPetal(i, true);
      }
      petalGeo.attributes.position.needsUpdate = true;
    }
    if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) ui.toast.style.opacity = 0; }

    updateAction();

    // camera follows
    const goal = cameraGoal();
    const camK = 1 - Math.exp(-dt * (state === 'play' ? 4 : 3));
    camera.position.lerp(goal.pos, camK);
    camLook.lerp(goal.look, camK);
    camera.lookAt(camLook);
    sun.position.set(p.x - 18, 13, p.z + 9); sun.target.position.set(p.x, 0, p.z - 4);
    const f = fovFor();
    if (!Number.isFinite(camera.fov)) { camera.fov = f; camera.updateProjectionMatrix(); }
    else if (Math.abs(camera.fov - f) > 0.01) { camera.fov += (f - camera.fov) * camK; camera.updateProjectionMatrix(); }

    if (state === 'desk') {
      scrollGroups.forEach((g, i) => {
        tmp.copy(g.position); tmp.z += 0.3; tmp.project(camera);
        const el = tagEls[i];
        el.style.left = ((tmp.x * 0.5 + 0.5) * innerWidth) + 'px';
        el.style.top = ((-tmp.y * 0.5 + 0.5) * innerHeight + 18) + 'px';
        el.style.opacity = openId ? 0 : 1;
      });
    }
  }

  snapCamera();
  camera.fov = fovFor(); camera.updateProjectionMatrix();
  function frame() {
    fitView();
    update(Math.min(clock.getDelta(), 0.05));
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
